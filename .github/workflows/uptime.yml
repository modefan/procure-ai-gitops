# Uptime check of the public live demo (plan 08 Task 13). The only workflow in this repo: the GitOps repo has no CI (Argo CD reads it).
#
# Every 30 minutes since the repos went public (plan 08c Task 2; public repos run Actions for free). While they were private it ran once a
# day to save the account's free Actions minutes (plan 08 fix wave ruling R2). `workflow_dispatch` stays, for a manual run (about one minute).
#
# Besides the hosts answering, it checks the Let's Encrypt certificate of every public host: fewer than 21 days left fails the run.
# cert-manager renews at 30 days, so a failure here means renewal has been failing for 9 days and there is still a week to fix it before
# browsers (HSTS: no click-through) refuse the site. Let's Encrypt sends no expiry e-mails any more, so this is the only warning.
#
# A failed run e-mails the repo owner (GitHub's default notification for failed workflow runs). GitHub turns off a public repo's schedules
# after 60 days without any commit; a commit (e.g. the publish workflow's release bump) re-arms it.
name: uptime

on:
  schedule:
    # Every 30 minutes, off the full hour (GitHub delays :00 most).
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Worst case with every host down: 4 checks x 3 tries x (20 s curl + 20 s pause), about 8 minutes, plus the certificate step (3 hosts x
    # at most 20 s); 12 minutes lets both steps write their ::error lines before the job would time out.
    timeout-minutes: 12
    steps:
      - name: Gateway ready, web app, Keycloak realm and demo switch
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # check NAME URL EXPECTED-TEXT: non-2xx (after 3 tries, 20 s apart) or a body without the expected text fails the run.
          check() {
            local name="$1" url="$2" expect="$3" body status
            for attempt in 1 2 3; do
              # On a connection error curl already writes 000 through -w (so no "|| echo 000", which would make it 000000).
              status=$(curl -sS -o body.txt -w '%{http_code}' --max-time 20 "$url") || true
              status=${status:-000}
              body=$(head -c 2000 body.txt 2>/dev/null || true)
              if [[ "$status" =~ ^2 ]] && grep -qF -- "$expect" <<<"$body"; then
                echo "ok   $name: HTTP $status"
                return 0
              fi
              sleep 20
            done
            echo "::error title=$name is down::$url answered HTTP $status (expected 2xx with '$expect')"
            fail=1
          }
          # The gateway's readiness (its own dependencies); /health/* is never rate-limited.
          check "gateway"  "https://procure.daleabels.com/health/ready" "Healthy"
          # The Angular app's files, served by the web pod through the gateway.
          check "web app"  "https://procure.daleabels.com/" "<title>ProcureAI</title>"
          # Keycloak's public realm (sign-in for every user).
          check "keycloak" "https://auth.daleabels.com/realms/procure/.well-known/openid-configuration" "\"issuer\""
          # The demo switch: read through the gateway from Access (so Access answers too). Switched off on purpose is not "down":
          # it is reported as a notice, not a failure.
          check "access (demo switch)" "https://procure.daleabels.com/api/v1/system/availability" "\"enabled\""
          if grep -qF '"enabled":false' body.txt 2>/dev/null; then
            echo "::notice title=Demo switched off::The demo switch is off (maintenance page shown on purpose)."
          fi
          exit $fail

      - name: Certificates have at least 21 days left
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          min_days=21
          for host in procure.daleabels.com auth.daleabels.com dashboard.daleabels.com; do
            # -servername: SNI, so Traefik picks the host's certificate (the default certificate otherwise).
            pem=$(timeout 20 openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null | openssl x509 2>/dev/null) || pem=""
            if [[ -z "$pem" ]]; then
              echo "::error title=$host certificate unreadable::no TLS certificate from $host:443"
              fail=1
              continue
            fi
            end=$(openssl x509 -noout -enddate <<<"$pem" | cut -d= -f2)
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            issuer=$(openssl x509 -noout -issuer <<<"$pem")
            if ! openssl x509 -noout -checkend $(( min_days * 86400 )) <<<"$pem" >/dev/null; then
              echo "::error title=$host certificate expires soon::$days days left (expires $end; renewal is due at 30). Check cert-manager: kubectl -n ingress-tls describe certificate"
              fail=1
            else
              echo "ok   $host: certificate valid for $days more days ($issuer)"
            fi
          done
          exit $fail
