# Values of the official argo-cd Helm chart (version in apps/values.yaml, argocd.chartVersion) for the local k3d cluster `procure`.
# bootstrap/install-argocd.ps1 installs Argo CD with these values; after that the `argocd` Application (wave -2) manages Argo CD itself
# with the same chart and values, so a change here is deployed by a push to this repo.
# Small on purpose: the node has 10 GB for everything (CLAUDE.md "My PC is shared"); one replica of each component, no Dex (the admin
# user is enough for a local cluster), no notifications, no ApplicationSet controller.

global:
  domain: argocd.procure.localtest.me

dex:
  enabled: false
notifications:
  enabled: false
# The chart has no switch for the ApplicationSet controller: no replicas (its CRD stays installed, unused).
applicationSet:
  replicas: 0
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

configs:
  params:
    # TLS ends at Traefik (the local CA's wildcard certificate); the server speaks plain http behind it.
    server.insecure: true
  cm:
    # How often Argo CD looks for new commits (the publish workflow's revision bump): every 2 minutes, plus up to 1 minute jitter.
    timeout.reconciliation: 120s
    # Health of an Application as a resource of the root Application (app of apps). Argo CD has no built-in check for it, so without
    # this the root would not wait for one wave of Applications before the next. An Application counts as Progressing until its sync
    # at the revisions its spec asks for has finished: Argo CD may call a just-created Application Healthy before its first sync, and
    # right after the root changed an Application's targetRevision (a deploy) its status still shows the previous, finished sync. So
    # every source pinned to a full commit SHA must be the revision Argo compared (status.sync) and the one the last sync applied
    # (operationState.syncResult). A failed sync is retried by the Application's own retry policy, so it is Progressing too, with the
    # reason. After that it reports its own health, with one exception: with annotation procure-ai/wave-gate: synced it counts as
    # Healthy for the wave order as soon as it is Synced, even while its pods are still Progressing. The platform needs that: it becomes
    # Healthy only after the apps' migrations (next wave) created the publications its Debezium servers wait for.
    # Tested by tests/Test-ApplicationHealth.ps1 (Lua); the order on a cluster by tests/Test-FreshCluster.ps1.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the first sync"
      if obj.status == nil then
        return hs
      end
      local health = nil
      local healthMessage = ""
      if obj.status.health ~= nil then
        health = obj.status.health.status
        if obj.status.health.message ~= nil then
          healthMessage = obj.status.health.message
        end
      end
      local op = nil
      local opMessage = ""
      local result = nil
      if obj.status.operationState ~= nil then
        op = obj.status.operationState.phase
        result = obj.status.operationState.syncResult
        if obj.status.operationState.message ~= nil then
          opMessage = obj.status.operationState.message
        end
      end
      local sync = nil
      if obj.status.sync ~= nil then
        sync = obj.status.sync.status
      end
      if op ~= "Succeeded" then
        if op ~= nil then
          hs.message = "Sync " .. op .. ": " .. opMessage
        end
        return hs
      end
      if sync ~= "Synced" then
        hs.message = "Sync status " .. tostring(sync)
        return hs
      end
      local targets = {}
      local compared = {}
      local applied = {}
      if obj.spec.sources ~= nil then
        for i, source in ipairs(obj.spec.sources) do
          targets[i] = source.targetRevision
        end
        if obj.status.sync.revisions ~= nil then
          compared = obj.status.sync.revisions
        end
        if result ~= nil and result.revisions ~= nil then
          applied = result.revisions
        end
      elseif obj.spec.source ~= nil then
        targets[1] = obj.spec.source.targetRevision
        compared[1] = obj.status.sync.revision
        if result ~= nil then
          applied[1] = result.revision
        end
      end
      for i, target in pairs(targets) do
        -- A full commit SHA (40 characters; chart versions and branch names are shorter). Argo CD's Lua has no string library.
        if type(target) == "string" and #target == 40 then
          if compared[i] ~= target then
            hs.message = "Source " .. i .. " compared at " .. tostring(compared[i]) .. ", target " .. target
            return hs
          end
          if applied[i] ~= target then
            hs.message = "Source " .. i .. " last synced at " .. tostring(applied[i]) .. ", target " .. target
            return hs
          end
        end
      end
      local gate = obj.metadata.annotations ~= nil and obj.metadata.annotations["procure-ai/wave-gate"] == "synced"
      if gate and health ~= "Degraded" then
        hs.status = "Healthy"
        hs.message = "Synced (wave gate 'synced': the next wave may start); own health " .. tostring(health)
        return hs
      end
      if health == nil or health == "Missing" or health == "Unknown" then
        hs.message = "Health " .. tostring(health)
        return hs
      end
      hs.status = health
      hs.message = healthMessage
      return hs

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

repoServer:
  # Renders the Helm charts (the umbrella has 13 subcharts) and clones the repos.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }
  copyutil:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 192Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.procure.localtest.me
    # No secretName: Traefik serves its default certificate (the local CA's wildcard, bootstrap/new-local-ca.ps1).
    tls: false
    extraTls:
      - hosts:
          - argocd.procure.localtest.me

redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }

redisSecretInit:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
