# Values of the official argo-cd Helm chart (version in apps/values.yaml, argocd.chartVersion) for the local k3d cluster `procure`.
# bootstrap/install-argocd.ps1 installs Argo CD with these values; after that the `argocd` Application (wave -2) manages Argo CD itself
# with the same chart and values, so a change here is deployed by a push to this repo.
# Small on purpose: the node has 10 GB for everything (CLAUDE.md "My PC is shared"); one replica of each component, no Dex (the admin
# user is enough for a local cluster), no notifications, no ApplicationSet controller.
# Two switches per environment live in the apps chart, not here (plan 08 ruling 4): argocd.adminEnabled (configs.cm admin.enabled) and
# argocd.ingressEnabled (server.ingress.enabled), set in envs/<env>/apps.yaml; the argocd Application passes them as valuesObject over this
# file and install-argocd.ps1 passes them with --set. Local: both on. A public host: both off (port-forward; `argocd --core`).

global:
  domain: argocd.procure.localtest.me

dex:
  enabled: false
notifications:
  enabled: false
# The chart has no switch for the ApplicationSet controller: no replicas (its CRD stays installed, unused).
applicationSet:
  replicas: 0
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

configs:
  params:
    # TLS ends at Traefik (the local CA's wildcard certificate); the server speaks plain http behind it.
    server.insecure: true
  cm:
    # How often Argo CD looks for new commits (the publish workflow's revision bump): every 2 minutes, plus up to 1 minute jitter.
    timeout.reconciliation: 120s
    # Health of an Application as a resource of the root Application (app of apps). Argo CD has no built-in check for it, so without
    # this the root would not wait for one wave of Applications before the next. An Application counts as Progressing until its sync
    # at the revisions its spec asks for has finished: Argo CD may call a just-created Application Healthy before its first sync, and
    # right after the root changed an Application's targetRevision (a deploy) its status still shows the previous, finished sync. So
    # every source pinned to a full commit SHA must be the revision Argo compared (status.sync), with sync status Synced and no sync
    # running (not the last sync's revision: a revision that changes nothing for an Application gets no new sync). A failed sync that Argo
    # CD still retries (its retry policy keeps the phase Running between attempts) is Progressing too, with the reason. A sync whose last
    # phase is Failed or Error (every retry spent, e.g. a failing migration hook) is Degraded (plan 08 ruling 9): the root then shows the
    # failure instead of Progressing for ever. After that it reports its own health, with one exception: with annotation procure-ai/wave-gate: synced it counts as
    # Healthy for the wave order as soon as it is Synced, even while its pods are still Progressing. The platform needs that: it becomes
    # Healthy only after the apps' migrations (next wave) created the publications its Debezium servers wait for.
    # Tested by tests/Test-ApplicationHealth.ps1 (Lua); the order on a cluster by tests/Test-FreshCluster.ps1.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the first sync"
      if obj.status == nil then
        return hs
      end
      local health = nil
      local healthMessage = ""
      if obj.status.health ~= nil then
        health = obj.status.health.status
        if obj.status.health.message ~= nil then
          healthMessage = obj.status.health.message
        end
      end
      local op = nil
      local opMessage = ""
      if obj.status.operationState ~= nil then
        op = obj.status.operationState.phase
        if obj.status.operationState.message ~= nil then
          opMessage = obj.status.operationState.message
        end
      end
      local sync = nil
      if obj.status.sync ~= nil then
        sync = obj.status.sync.status
      end
      local targets = {}
      local compared = {}
      if obj.spec.sources ~= nil then
        for i, source in ipairs(obj.spec.sources) do
          targets[i] = source.targetRevision
        end
        if obj.status.sync ~= nil and obj.status.sync.revisions ~= nil then
          compared = obj.status.sync.revisions
        end
      elseif obj.spec.source ~= nil then
        targets[1] = obj.spec.source.targetRevision
        if obj.status.sync ~= nil then
          compared[1] = obj.status.sync.revision
        end
      end
      -- Every source pinned to a full commit SHA (40 characters; chart versions and branch names are shorter; Argo CD's Lua has no string
      -- library) compared at that SHA: the status is about the revisions the spec asks for, not an earlier deploy's.
      local atTarget = true
      local notAt = ""
      for i, target in pairs(targets) do
        if type(target) == "string" and #target == 40 and compared[i] ~= target then
          atTarget = false
          notAt = "Source " .. i .. " compared at " .. tostring(compared[i]) .. ", target " .. target
        end
      end
      -- The revisions the last operation synced (operationState.operation.sync, present even when a failed sync has no syncResult). Right
      -- after the root set a new target, the Application is compared at it while operationState still holds the earlier target's failed
      -- sync until auto-sync starts the new one: that failure is not the target's.
      local opAtTarget = true
      if obj.status.operationState ~= nil and obj.status.operationState.operation ~= nil
          and obj.status.operationState.operation.sync ~= nil then
        local opSync = obj.status.operationState.operation.sync
        local opRevisions = {}
        if opSync.revisions ~= nil then
          opRevisions = opSync.revisions
        else
          opRevisions[1] = opSync.revision
        end
        for i, target in pairs(targets) do
          if type(target) == "string" and #target == 40 and opRevisions[i] ~= target then
            opAtTarget = false
          end
        end
      end
      -- Every retry spent (Argo CD keeps the phase Running between attempts): Degraded, so the root shows the failure (plan 08 ruling 9).
      -- Only for the current target: compared at it, and the failed operation was its sync (a failed sync of an earlier target is history
      -- once the root asked for a new one).
      if (op == "Failed" or op == "Error") and atTarget and opAtTarget then
        hs.status = "Degraded"
        hs.message = "Sync " .. op .. ": " .. opMessage
        return hs
      end
      if op ~= "Succeeded" then
        if op ~= nil then
          hs.message = "Sync " .. op .. ": " .. opMessage
        end
        return hs
      end
      if sync ~= "Synced" then
        hs.message = "Sync status " .. tostring(sync)
        return hs
      end
      -- Synced (checked above) at the target revision: the live state is that revision's. No check on the last sync's revision: a
      -- revision that renders the same manifests (e.g. an app-only deploy for the platform) is Synced without a new sync, so requiring
      -- one would block the next wave forever.
      if not atTarget then
        hs.message = notAt
        return hs
      end
      local gate = obj.metadata.annotations ~= nil and obj.metadata.annotations["procure-ai/wave-gate"] == "synced"
      if gate and health ~= "Degraded" then
        hs.status = "Healthy"
        hs.message = "Synced (wave gate 'synced': the next wave may start); own health " .. tostring(health)
        return hs
      end
      if health == nil or health == "Missing" or health == "Unknown" then
        hs.message = "Health " .. tostring(health)
        return hs
      end
      hs.status = health
      hs.message = healthMessage
      return hs

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

repoServer:
  # Renders the Helm charts (the umbrella has 13 subcharts) and clones the repos.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }
  copyutil:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 192Mi }
  ingress:
    # Default only: argocd.ingressEnabled (apps chart) decides.
    enabled: true
    ingressClassName: traefik
    hostname: argocd.procure.localtest.me
    # No secretName: Traefik serves its default certificate (the local CA's wildcard, bootstrap/new-local-ca.ps1).
    tls: false
    extraTls:
      - hosts:
          - argocd.procure.localtest.me

redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }

redisSecretInit:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
