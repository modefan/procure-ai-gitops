# Values of the procure-observability chart (procure-ai deploy/charts/procure-observability) for the hosted VM: the OpenTelemetry
# Collector (DaemonSet) and the Aspire dashboard at https://dashboard.daleabels.com (Keycloak sign-in, dashboard-viewer only; Review Focus 2).
# No secrets here: the dashboard's client secret is Secret observability/procure-keycloak (bootstrap/new-secrets.ps1 -Environment hosted).
hosts:
  dashboard: dashboard.daleabels.com
  # The break-glass dashboard (plan 08b Task 4): its own login (Traefik basic auth), no Keycloak (Get-OperatorLogin.ps1 -Tool dashboard).
  dashboardDirect: dashboard-direct.daleabels.com
  keycloak: auth.daleabels.com
ingressClassName: traefik
appNamespace: procure

# The break-glass dashboard (plan 08b Task 4; off in the chart by default, fix round 1 M4) and the collector's second exporter to it in
# every pipeline (the exporter otlp/direct itself is defined in the chart's values).
dashboardDirect:
  enabled: true
opentelemetry-collector:
  alternateConfig:
    service:
      pipelines:
        logs:
          exporters: [otlp, otlp/direct]
        metrics:
          exporters: [otlp, otlp/direct]
        traces:
          exporters: [otlp, otlp/direct]
