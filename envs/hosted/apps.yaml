# Values of the app of apps (apps/) for the hosted VM (Contabo VPS, bootstrap/hosted/): the public live demo at https://procure.daleabels.com.
# The revision is in release.yaml. Before the first sync: bootstrap/hosted/install-cert-manager.ps1 (edge, certificate),
# bootstrap/new-local-ca.ps1 -Environment hosted (the internal CA for MongoDB's TLS) and bootstrap/new-secrets.ps1 -Environment hosted.
env: hosted
argocd:
  # The public host https://argocd.daleabels.com behind a Keycloak gate (plan 08c Task 1, rulings R1, R2, R9; Dale 2026-11-13): the ingress
  # switch turns on the chart's Ingress, the edge router, the gate (oauth2-proxy: realm ops, group argocd-admins only) and the argocd-server
  # NetworkPolicy rule for Traefik (envs/hosted/argocd.yaml). People sign in with Keycloak; the admin login stays on as break-glass for when
  # Keycloak is down (Dale 2026-11-08, Task 12c), and the public host refuses it (403): admin only through the tunnel
  # (bootstrap/hosted/open-argocd.ps1 -Tunnel). false: no public host, the tunnel only (as before plan 08c).
  adminEnabled: true
  ingressEnabled: true
platform:
  enabled: true
observability:
  # The collector and the Aspire dashboard at https://dashboard.daleabels.com (Keycloak sign-in, dashboard-viewer only).
  enabled: true
procureAi:
  enabled: true
operator:
  # pgAdmin, DbGate and Redis Insight at https://pgadmin|mongo|redis.daleabels.com, each with its own login (plan 08b Task 4).
  enabled: true
