# Values of the argo-cd chart for the hosted VM, over argocd/values.yaml (plan 08 Task 12c): the second values file of the argocd
# Application (apps chart) and of bootstrap/install-argocd.ps1. The switches (admin user on as break-glass, no ingress) stay in
# envs/hosted/apps.yaml.
configs:
  cm:
    # No public address: Argo CD is opened through the SSH tunnel and `kubectl port-forward` on Dale's PC
    # (bootstrap/hosted/open-argocd.ps1, 127.0.0.1:8080). The OIDC redirect URIs are <url>/auth/callback and <url>/pkce/verify, which the
    # Keycloak client `argocd` allows (platform chart keycloak.argocdUrl, default http://127.0.0.1:8080: keep both equal).
    url: http://127.0.0.1:8080
    # Keycloak sign-in (see the header of argocd/values.yaml): realm ops (not the demo realm; ruling R6c) at auth.daleabels.com (Let's Encrypt certificate; the
    # server reaches it through the CoreDNS rewrite, bootstrap/hosted/coredns-custom.yaml). Public client with PKCE, no client secret.
    oidc.config: |
      name: Keycloak
      issuer: https://auth.daleabels.com/realms/ops
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile"]
      refreshTokenThreshold: 2m

# Network policies (review 12c M5). The chart's own NetworkPolicy for argocd-server allows ingress from everywhere (`ingress: [{}]`, not
# configurable), so with the admin login on (break-glass) every pod of the cluster could try POST /api/v1/session as admin. On the VM nobody
# needs to reach argocd-server over the pod network: there is no ingress (people and Claude come through `kubectl port-forward`, which the
# kubelet carries into the pod's own network namespace, so a NetworkPolicy does not apply to it), and no Argo CD component calls the server
# (the controller and the repo server talk to each other and to Redis). The chart's policies are switched off here and the same set is
# declared below, with argocd-server allowing no ingress at all. The other three are copies of the chart's (10.11.7) policies: compare
# them with the chart when argocd.chartVersion changes (tests/Test-ArgocdNetworkPolicy.ps1 renders the chart and checks the set).
# Local keeps the chart's policies (its Traefik ingress must reach the server).
global:
  networkPolicy:
    create: false

extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-server
      namespace: argocd
      labels: { app.kubernetes.io/part-of: argocd, app.kubernetes.io/component: server }
    spec:
      podSelector:
        matchLabels: { app.kubernetes.io/name: argocd-server, app.kubernetes.io/instance: argocd }
      policyTypes: [Ingress]
      # No rule: no ingress over the pod network (kubelet probes from the node are still allowed by k3s's policy controller).
      ingress: []
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-repo-server
      namespace: argocd
      labels: { app.kubernetes.io/part-of: argocd, app.kubernetes.io/component: repo-server }
    spec:
      podSelector:
        matchLabels: { app.kubernetes.io/name: argocd-repo-server, app.kubernetes.io/instance: argocd }
      policyTypes: [Ingress]
      ingress:
        - from:
            - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-server, app.kubernetes.io/instance: argocd } }
            - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-application-controller, app.kubernetes.io/instance: argocd } }
            - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-applicationset-controller, app.kubernetes.io/instance: argocd } }
          ports:
            - { port: repo-server, protocol: TCP }
        - from:
            - namespaceSelector: {}
          ports:
            - port: metrics
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-redis
      namespace: argocd
      labels: { app.kubernetes.io/part-of: argocd, app.kubernetes.io/component: redis }
    spec:
      podSelector:
        matchLabels: { app.kubernetes.io/name: argocd-redis, app.kubernetes.io/instance: argocd }
      policyTypes: [Ingress]
      ingress:
        - from:
            - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-server, app.kubernetes.io/instance: argocd } }
            - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-repo-server, app.kubernetes.io/instance: argocd } }
            - podSelector: { matchLabels: { app.kubernetes.io/name: argocd-application-controller, app.kubernetes.io/instance: argocd } }
          ports:
            - { port: redis, protocol: TCP }
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-application-controller
      namespace: argocd
      labels: { app.kubernetes.io/part-of: argocd, app.kubernetes.io/component: application-controller }
    spec:
      podSelector:
        matchLabels: { app.kubernetes.io/name: argocd-application-controller, app.kubernetes.io/instance: argocd }
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector: {}
          ports:
            - port: metrics
