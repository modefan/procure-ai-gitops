# Values of the procure-platform chart (procure-ai deploy/charts/procure-platform) for the hosted VM (public live demo, plan 08 Task 12).
# No secrets here: the chart references the Secrets bootstrap/new-secrets.ps1 -Environment hosted creates. The certificate is not set here
# either: every Ingress gets Traefik's default certificate, the Let's Encrypt one of bootstrap/hosted/install-cert-manager.ps1.
global:
  imageRegistry: ghcr.io/modefan
  # The GHCR packages are public since plan 08c Task 2 (2026-11-13): the VM pulls anonymously, no ghcr-pull Secret (the chart's default
  # list names it for the local cluster).
  imagePullSecrets: []

storageClassName: local-path
ingressClassName: traefik

hosts:
  app: procure.daleabels.com
  keycloak: auth.daleabels.com
  dashboard: dashboard.daleabels.com
  rabbitmq: rabbitmq.daleabels.com

# The VM's disk is 290 GB; the demo data is small. Postgres also holds the WAL the Debezium slots keep (max_slot_wal_keep_size 1GB each).
postgres:
  storage: 20Gi
mongo:
  storage: 5Gi
rabbitmq:
  # The operator's own management login (Secret procure-rabbitmq key operator-password); the UI at https://<hosts.rabbitmq>. The apps'
  # user then loses its management tags (AMQP only; plan 08b Task 4 fix round 1).
  operator: { key: operator-password, user: operator, tags: administrator }
  storage: 2Gi

keycloak:
  # Argo CD's public address (plan 08c Task 1, ruling R3): the argocd client's redirect URIs and the argocd-gate client's callback. Equal
  # to configs.cm.url in envs/hosted/argocd.yaml. The tunnel's port-forward stays allowed too (keycloak.argocdTunnelUrl, default
  # http://127.0.0.1:8080, = configs.cm.additionalUrls there).
  argocdUrl: https://argocd.daleabels.com
  ingress:
    # Plan 08 ruling 4: only Keycloak's public paths of the procure realm (no admin console, admin REST API, master realm or welcome page).
    publicPathsOnly: true
    # The demo realm and realm ops (Argo CD's sign-in, ruling R6c: the browser opens its login page at auth.daleabels.com/realms/ops/;
    # brute-force lockout and an authenticator app protect it). master only with adminConsole (below).
    publicRealms: [procure, ops]
    # The admin console and the master realm on the public host too (plan 08b Task 4): Dale manages Keycloak from any browser.
    adminConsole: true
    # Plan 08 fix wave rulings R6b/R6c: per-client-address rate limits on every path of the Keycloak host, the token endpoints with their
    # own higher limit (numbers: the chart's defaults, deploy/charts/procure-platform/values.yaml keycloak.ingress.rateLimit). The demo
    # realm's own brute-force lockout stays off (it let anyone keep the shared demo users locked); realm ops has one.
    rateLimit:
      enabled: true

mailpit:
  ingress:
    # Plan 08 ruling 4: no public Mailpit; kubectl port-forward svc/mailpit 8025 over the SSH tunnel.
    enabled: false

# The operator's direct access (plan 08b Task 4, Dale 2026-11-08; procure-ai docs/hosting.md "Operate from the browser"): every component
# on its own address with its own login, not through Keycloak or the gateway. The Secret keys these name come from bootstrap/new-secrets.ps1
# (run it before this file reaches the cluster: a Secret key is never optional).
operatorReaders:
  postgresKey: operator-reader-postgres-password
  mongoKey: operator-reader-mongo-password
  redis:
    key: operator-reader-password
operatorAccess:
  tools: { postgres: pgadmin, mongo: mongo-ui, redis: redis-insight }
  rabbitmq:
    enabled: true
keycloakConfig:
  # Every password sign-in to the master realm asks for a one-time code (admin console and password grants); Dale's own master admin
  # `operator` (password and authenticator from DEMO PASSWORDS.txt).
  masterRealm:
    enabled: true
  # The automation signs in as the confidential client procure-automation (client credentials, Secret procure-keycloak key
  # automation-client-secret from bootstrap/new-secrets.ps1), never with a password; the bootstrap admin is disabled once the client works
  # (break-glass only: procure-ai docs/hosting.md "Keycloak's automation client and the bootstrap admin"). Plan 08b Task 4 fix round 1.
  automationClient:
    clientId: procure-automation
    secretKey: automation-client-secret
    disableBootstrapAdmin: true
  operatorUser:
    username: operator
    passwordKey: operator-password
    totpKey: operator-totp-base32
