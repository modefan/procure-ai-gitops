# What is deployed to this environment. Written by procure-ai's publish workflow (.github/workflows/publish.yml) after CI passed and the
# images were pushed; set it by hand only to roll back or pin a revision whose images are in GHCR (the retention workflow keeps the
# newest 15 versions per image plus every tag of the last 15 releases).
# appRevision: the procure-ai commit (full SHA): its charts (deploy/charts) and its app images ghcr.io/modefan/procure-ai-<name>:<sha>.
# platformImageTags: the platform images' tags, the git tree hash of procure-ai infra/<name> (they change only when that folder changes,
# so an app-only deploy leaves Postgres, Keycloak and Debezium running).
appRevision: "d074cc41297ce0d84f29104a873536a9faf95eb0"
platformImageTags:
  postgres: "4eb631f845098f2eb5636b43ede8ef74975f9dfd"
  keycloak: "de8790c9548b26fe40a8ce88b449b9112fc7456d"
  debezium: "b27e172ee36699b60b349d6daddfd0346d18695c"
