# Values of the procure-platform chart (procure-ai deploy/charts/procure-platform) for the local k3d cluster `procure`.
# No secrets here: the chart references the Secrets bootstrap/new-secrets.ps1 creates. The image tag is not set here either: it is the
# app revision (release.yaml, plan 07 Task 6), or `--set global.imageTag=local-<sha7>` for images built on the PC and imported with
# `deploy/scripts/build-images.ps1 -Tag local-<sha7> -ImportTo procure`.
global:
  # procure-ai's publish workflow pushes the images here (private, pulled with Secret ghcr-pull). For images built on the PC, tag them
  # with this registry and import them into k3d (deploy/scripts/build-images.ps1 -Registry ghcr.io/modefan -ImportTo procure).
  imageRegistry: ghcr.io/modefan

storageClassName: local-path
ingressClassName: traefik

hosts:
  app: procure.localtest.me
  keycloak: auth.procure.localtest.me
  dashboard: dashboard.procure.localtest.me
  mailpit: mail.procure.localtest.me

postgres:
  storage: 5Gi
mongo:
  storage: 2Gi
rabbitmq:
  storage: 1Gi
