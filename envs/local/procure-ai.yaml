# Values of the procure-ai umbrella chart (procure-ai deploy/charts/procure-ai) for the local k3d cluster `procure`.
# No secrets here: the chart references the Secrets bootstrap/new-secrets.ps1 creates. The image tag is the app revision (release.yaml,
# plan 07 Task 6), or `--set global.imageTag=local-<sha7>` for images built on the PC and imported with
# `deploy/scripts/build-images.ps1 -Tag local-<sha7> -ImportTo procure`.
global:
  # procure-ai's publish workflow pushes the images here (public since plan 08c Task 2; the local cluster still sends Secret ghcr-pull). For images built on the PC, tag them
  # with this registry and import them into k3d (deploy/scripts/build-images.ps1 -Registry ghcr.io/modefan -ImportTo procure).
  imageRegistry: ghcr.io/modefan
  # A deploy replaces each app's single pod instead of starting a second one next to it first: the 10 GB node has no room for ~12 surge
  # pods (plus the migration Jobs) on top of the running system. maxSurge 0 / maxUnavailable 1 rather than Recreate: the same for one
  # replica, and still one pod at a time if an app ever runs more. Cost: each API is unavailable for its few seconds of restart.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  hosts:
    app: procure.localtest.me
    keycloak: auth.procure.localtest.me
  # The demo: seeded data, one-click demo login, the nightly reset and the "behind the scenes" panel are on.
  demo:
    seed: true
    reset: true
    devPanel: true
    login: true

# The web app's runtime config.json for this environment (the chart's defaults, with the dev panel on and the cluster's dashboard).
web:
  configJson:
    logger:
      consoleLevel: info
    observability:
      dashboardUrl: https://dashboard.procure.localtest.me
    devPanel:
      enabled: true
    # The repos are public (plan 08c Task 2); merged into the chart's portfolio defaults (demos and links stay).
    portfolio:
      reposPublic: true
