#cloud-config
# First boot of the hosted VM after a (re)install (Contabo user_data; Terraform templatefile: admin_user, ssh_public_key, k3s_version,
# node_ip). Runs once; for a running VM make the same change over SSH and keep this file in line (main.tf ignores user_data changes).
# Checked by bootstrap/hosted/Test-HostBaseline.ps1.
#  - one non-root sudo user, SSH key only: no password login, no root login, no keyboard-interactive, only that user (the image's
#    default user `ubuntu`, which Contabo's merged config also creates, is removed);
#  - a host firewall (nftables table inet procure_host) next to Contabo's: on the public interface only 22, 80, 443 and replies come in;
#  - fail2ban on sshd (journal backend; OpenSSH >= 9.8 logs failed logins as sshd-session under ssh.service);
#  - unattended security upgrades (no automatic reboot: a reboot is a deliberate step, it restarts the whole demo);
#  - k3s pinned (download and install retried); the node address ${node_ip} lives on a dummy interface (Contabo's private networks are
#    a paid add-on), created before k3s starts on every boot; the API server, the kubelet and kube-proxy's health port listen only on
#    it (the API is reached through an SSH tunnel); kubelet graceful shutdown 60 s (20 s of it for critical pods); memory reservations
#    sized for the 24 GB VM.

users:
  - name: ${admin_user}
    gecos: procure-ai admin
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

disable_root: true
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - fail2ban
  - python3-systemd
  - nftables

write_files:
  # sshd takes the first value it reads, and Ubuntu's sshd_config includes sshd_config.d/*.conf at the top: 00- wins over cloud-init's
  # own 50-cloud-init.conf. Local forwarding stays on (the Kubernetes API tunnel); nothing else is forwarded.
  - path: /etc/ssh/sshd_config.d/00-procure-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      PermitEmptyPasswords no
      AllowUsers ${admin_user}
      AllowTcpForwarding local
      AllowAgentForwarding no
      AllowStreamLocalForwarding no
      PermitTunnel no
      X11Forwarding no
      GatewayPorts no
      MaxAuthTries 3
      LoginGraceTime 30

  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      # Ubuntu runs sshd as ssh.service, and OpenSSH >= 9.8 logs the failed logins from the per-connection sshd-session process:
      # match the unit's whole journal and both process names, or the jail never sees a failure.
      [sshd]
      enabled = true
      backend = systemd
      filter = sshd[_daemon="sshd(?:-session)?", journalmatch="_SYSTEMD_UNIT=ssh.service"]
      maxretry = 6
      findtime = 10m
      bantime = 30m

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52procure-unattended-upgrades
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";

  # The kubelet's graceful node shutdown needs logind to wait that long. logind reads its drop-ins from /etc, /run and /usr/lib sorted by
  # file name, the last one winning: unattended-upgrades ships "unattended-upgrades-logind-maxdelay.conf" (30 s) and the kubelet writes
  # "99-kubelet.conf" (60 s), so this file must sort after both.
  - path: /etc/systemd/logind.conf.d/zz-procure-kubelet-shutdown.conf
    permissions: "0644"
    content: |
      [Login]
      InhibitDelayMaxSec=75

  # Ubuntu 26.04 (AppArmor 5, kernel.apparmor_restrict_unprivileged_unconfined=1) lets an unconfined, unprivileged process change its
  # profile only by stacking. k3s's bundled runc has no profile, so for every non-root container runc's init (already unprivileged when it
  # applies the container's profile) gets "cri-containerd.apparmor.d//&unconfined", and the container's processes may not signal each
  # other: Postgres and MongoDB could not stop their own first-start servers (plan 08 Task 12: "pg_ctl: could not send stop signal:
  # Permission denied", half-initialised volumes). Ubuntu solves this for its own /usr/sbin/runc with the `runc` profile (unconfined flag,
  # userns); this file is that profile with k3s's runc path added, and Ubuntu's file is disabled so only one `runc` definition loads.
  # The kernel restriction stays on; containerd's profile already accepts signals from `runc` (stopping containers works).
  - path: /etc/apparmor.d/procure-k3s-runc
    permissions: "0644"
    content: |
      abi <abi/5.0>,
      include <tunables/global>

      profile runc /{usr/{bin,sbin},var/lib/rancher/k3s/data/*/bin}/runc flags=(unconfined) {
        userns,
        @{exec_path} mr,
        include if exists <local/runc>
      }

  - path: /etc/rancher/k3s/config.yaml
    permissions: "0600"
    content: |
      # The node and the API on the dummy node address only: nothing of Kubernetes listens on the public interfaces except Traefik's
      # 80/443 (host ports of the Traefik pod, Task 12), and Contabo's firewall drops everything but 22, 80 and 443 anyway.
      node-ip: ${node_ip}
      advertise-address: ${node_ip}
      bind-address: ${node_ip}
      write-kubeconfig-mode: "0600"
      # One node: pods reach each other over the cni0 bridge, so flannel needs no tunnel. host-gw opens no socket (VXLAN would listen
      # on UDP 8472 on every interface, an unauthenticated way into the pod network).
      flannel-backend: host-gw
      # kube-proxy's health endpoint (10256) on the node address too (its metrics stay on 127.0.0.1).
      kube-proxy-arg:
        - "healthz-bind-address=${node_ip}:10256"
      # Secrets encrypted at rest in the datastore.
      secrets-encryption: true

  # Kubelet settings as a configuration drop-in (k3s reads agent/etc/kubelet.conf.d; kubelet command-line flags for these are
  # deprecated in favour of the configuration file).
  - path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-procure.conf
    permissions: "0644"
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      # The kubelet API (10250) on the node address only; the API server and metrics-server reach it by the node's InternalIP.
      address: ${node_ip}
      shutdownGracePeriod: 60s
      shutdownGracePeriodCriticalPods: 20s
      # 24 GB VM: 1.5 GiB kept for k3s itself (API server, etcd-less sqlite, kubelet, containerd in one process), 512 MiB for the OS
      # (sshd, fail2ban, unattended upgrades), eviction below 1 GiB free.
      kubeReserved:
        memory: 1536Mi
      systemReserved:
        memory: 512Mi
      evictionHard:
        memory.available: 1Gi
        nodefs.available: 5%
        imagefs.available: 5%

  # k3s binds the node address: before k3s starts (every boot), the dummy interface procure0 gets it. Idempotent, independent of the
  # network manager the image uses (netplan, networkd or ifupdown).
  - path: /usr/local/sbin/ensure-node-ip.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      ip link show procure0 >/dev/null 2>&1 || ip link add procure0 type dummy
      ip addr replace ${node_ip}/32 dev procure0
      ip link set procure0 up
  - path: /etc/systemd/system/k3s.service.d/10-node-ip.conf
    permissions: "0644"
    content: |
      [Unit]
      Wants=network-online.target
      After=network-online.target
      [Service]
      ExecStartPre=/usr/local/sbin/ensure-node-ip.sh

  # Host firewall, in its own nftables table (k3s's kube-proxy and flannel rules live in the ip/ip6 tables of iptables-nft and are not
  # touched; the file replaces only this table). Public interface eth0: replies, SSH, HTTP, HTTPS and the ICMPv6 that IPv6 needs come in,
  # nothing else. The input chain covers the host's own sockets; the forward chain covers what kube-proxy and host ports forward to pods
  # (after DNAT, so the original destination port decides): only 80 and 443, never a NodePort. Contabo's firewall in front does the same.
  - path: /etc/procure/host-firewall.nft
    permissions: "0644"
    content: |
      table inet procure_host
      delete table inet procure_host
      table inet procure_host {
        chain input {
          type filter hook input priority filter; policy accept;
          iifname != "eth0" accept
          ct state established,related accept
          ct state invalid drop
          tcp dport { 22, 80, 443 } accept
          icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big, destination-unreachable, time-exceeded, parameter-problem } accept
          icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
          counter drop
        }
        chain forward {
          type filter hook forward priority filter; policy accept;
          iifname != "eth0" accept
          ct state established,related accept
          ct state invalid drop
          meta l4proto tcp ct original proto-dst { 80, 443 } accept
          counter drop
        }
      }
  - path: /etc/systemd/system/procure-host-firewall.service
    permissions: "0644"
    content: |
      [Unit]
      Description=procure-ai host firewall (nftables table inet procure_host)
      DefaultDependencies=no
      Before=network-pre.target k3s.service
      Wants=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/procure/host-firewall.nft
      ExecStop=/usr/sbin/nft delete table inet procure_host
      [Install]
      WantedBy=multi-user.target

  # The install script of the pinned release (it checks the binary's sha256 against the release's checksums). The whole download and
  # install is tried up to 3 times (a GitHub or DNS hiccup on the first boot must not leave the VM without k3s).
  - path: /usr/local/sbin/install-k3s.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      set -u
      version='${k3s_version}'
      tag=$(printf '%s' "$version" | sed 's/+/%2B/')
      for attempt in 1 2 3; do
        if curl -sfL --retry 5 --retry-delay 5 --retry-all-errors "https://raw.githubusercontent.com/k3s-io/k3s/$tag/install.sh" -o /tmp/k3s-install.sh           && INSTALL_K3S_VERSION="$version" sh /tmp/k3s-install.sh server; then
          rm -f /tmp/k3s-install.sh
          exit 0
        fi
        echo "k3s install attempt $attempt failed" >&2
        sleep 20
      done
      exit 1

runcmd:
  - [systemctl, daemon-reload]
  # The k3s runc profile (write_files above) before k3s starts its first container; Ubuntu's own runc file is disabled for it.
  - [ln, -sf, /etc/apparmor.d/runc, /etc/apparmor.d/disable/runc]
  - [apparmor_parser, -r, /etc/apparmor.d/procure-k3s-runc]
  - [systemctl, enable, --now, procure-host-firewall.service]
  - [sh, -c, "if id ubuntu >/dev/null 2>&1; then userdel -r ubuntu; fi"]
  - [systemctl, restart, systemd-logind]
  - [systemctl, restart, ssh]
  - [systemctl, enable, --now, fail2ban]
  - [systemctl, enable, --now, unattended-upgrades]
  - [/usr/local/sbin/ensure-node-ip.sh]
  - [/usr/local/sbin/install-k3s.sh]
