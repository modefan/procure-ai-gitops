suite: applications
templates:
  - templates/applications.yaml
set:
  appRevision: 0123456789abcdef0123456789abcdef01234567
  observability:
    enabled: true
tests:
  - it: the operator's web UIs (plan 08b Task 4) are off by default
    asserts:
      - hasDocuments:
          count: 4

  - it: an environment turns the operator's web UIs on, in namespace operator from the procure-ops chart at appRevision
    set:
      operator:
        enabled: true
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: spec.destination.namespace
          value: operator
        documentSelector: { path: metadata.name, value: operator }
      - equal:
          path: spec.sources[0]
          value:
            repoURL: git@github.com:modefan/procure-ai.git
            targetRevision: 0123456789abcdef0123456789abcdef01234567
            path: deploy/charts/procure-ops
            helm:
              releaseName: operator
              valueFiles:
                - $values/envs/local/operator.yaml
              valuesObject:
                global:
                  imageTag: 0123456789abcdef0123456789abcdef01234567
        documentSelector: { path: metadata.name, value: operator }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
        documentSelector: { path: metadata.name, value: operator }
      - notExists:
          path: metadata.annotations["procure-ai/wave-gate"]
        documentSelector: { path: metadata.name, value: operator }
      - equal:
          path: spec.syncPolicy.automated
          value: { prune: true, selfHeal: true }
        documentSelector: { path: metadata.name, value: operator }

  - it: applications have the sync waves
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-2"
        documentSelector: { path: metadata.name, value: argocd }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        documentSelector: { path: metadata.name, value: platform }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        documentSelector: { path: metadata.name, value: observability }
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
        documentSelector: { path: metadata.name, value: procure-ai }

  - it: the platform does not hold the apps back until it is Healthy (wave gate synced; carry-over from Task 5)
    asserts:
      - equal:
          path: metadata.annotations["procure-ai/wave-gate"]
          value: synced
        documentSelector: { path: metadata.name, value: platform }
      - notExists:
          path: metadata.annotations["procure-ai/wave-gate"]
        documentSelector: { path: metadata.name, value: procure-ai }

  - it: procure-ai chart source uses appRevision
    asserts:
      - equal:
          path: spec.sources[0]
          value:
            repoURL: git@github.com:modefan/procure-ai.git
            targetRevision: 0123456789abcdef0123456789abcdef01234567
            path: deploy/charts/procure-ai
            helm:
              releaseName: procure-ai
              valueFiles:
                - $values/envs/local/procure-ai.yaml
              valuesObject:
                global:
                  imageTag: 0123456789abcdef0123456789abcdef01234567
        documentSelector: { path: metadata.name, value: procure-ai }
      - equal:
          path: spec.sources[0].targetRevision
          value: 0123456789abcdef0123456789abcdef01234567
        documentSelector: { path: metadata.name, value: platform }
      - equal:
          path: spec.sources[0].helm.valuesObject.global.imageTag
          value: 0123456789abcdef0123456789abcdef01234567
        documentSelector: { path: metadata.name, value: platform }
      - equal:
          path: spec.sources[0].path
          value: deploy/charts/procure-platform
        documentSelector: { path: metadata.name, value: platform }

  - it: values come from the gitops repo ref
    asserts:
      - equal:
          path: spec.sources[1]
          value:
            repoURL: git@github.com:modefan/procure-ai-gitops.git
            targetRevision: main
            ref: values
        documentSelector: { path: metadata.name, value: procure-ai }
      - equal:
          path: spec.sources[1]
          value:
            repoURL: git@github.com:modefan/procure-ai-gitops.git
            targetRevision: main
            ref: values
        documentSelector: { path: metadata.name, value: platform }
      - equal:
          path: spec.sources[0].helm.valueFiles
          value: [$values/envs/local/platform.yaml]
        documentSelector: { path: metadata.name, value: platform }
      - equal:
          path: spec.sources[0].helm.valueFiles
          value: [$values/envs/local/observability.yaml]
        documentSelector: { path: metadata.name, value: observability }
      - equal:
          path: spec.sources
          value:
            - repoURL: ghcr.io/argoproj/argo-helm
              chart: argo-cd
              targetRevision: 10.11.7
              helm:
                releaseName: argocd
                # The environment's own Argo CD values (url, OIDC issuer) over the shared ones (Task 12c).
                valueFiles: [$values/argocd/values.yaml, $values/envs/local/argocd.yaml]
                # The environment's switches (argocd.adminEnabled, argocd.ingressEnabled); local keeps both on.
                valuesObject:
                  configs:
                    cm:
                      admin.enabled: true
                  server:
                    ingress:
                      enabled: true
            - repoURL: git@github.com:modefan/procure-ai-gitops.git
              targetRevision: main
              ref: values
        documentSelector: { path: metadata.name, value: argocd }

  - it: every Application syncs automatically with prune, selfHeal, server-side apply and retries
    asserts:
      - equal:
          path: spec.syncPolicy.automated
          value: { prune: true, selfHeal: true }
      - contains:
          path: spec.syncPolicy.syncOptions
          content: ServerSideApply=true
      # Three retries (plan 08 ruling 9): a failing migration is Failed, and the root Degraded, within minutes, not after ten reruns.
      - equal:
          path: spec.syncPolicy.retry.limit
          value: 3

  - it: StatefulSets do not stay OutOfSync over the PVC template fields the API server adds
    asserts:
      - contains:
          path: spec.ignoreDifferences
          content:
            group: apps
            kind: StatefulSet
            jqPathExpressions:
              - .spec.volumeClaimTemplates[]?.apiVersion
              - .spec.volumeClaimTemplates[]?.kind

  - it: observability is left out until its chart exists
    set:
      observability:
        enabled: false
    asserts:
      - hasDocuments:
          count: 3

  - it: a short or missing appRevision fails the render
    set:
      appRevision: 36dfd83
    asserts:
      - failedTemplate:
          errorPattern: appRevision must be a full 40-character commit SHA

  - it: platform image tags go to the platform and the apps (postgres for the migrations), the app tag stays appRevision
    set:
      platformImageTags:
        postgres: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        keycloak: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        debezium: cccccccccccccccccccccccccccccccccccccccc
    asserts:
      - equal:
          path: spec.sources[0].helm.valuesObject.global
          value:
            imageTag: 0123456789abcdef0123456789abcdef01234567
            imageTags:
              postgres: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              keycloak: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              debezium: cccccccccccccccccccccccccccccccccccccccc
        documentSelector: { path: metadata.name, value: platform }
      - equal:
          path: spec.sources[0].helm.valuesObject.global.imageTags.postgres
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        documentSelector: { path: metadata.name, value: procure-ai }

  - it: a revision made of digits only stays a string
    set:
      appRevision: "1234567890123456789012345678901234567890"
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: "1234567890123456789012345678901234567890"
        documentSelector: { path: metadata.name, value: procure-ai }
      - equal:
          path: spec.sources[0].helm.valuesObject.global.imageTag
          value: "1234567890123456789012345678901234567890"
        documentSelector: { path: metadata.name, value: procure-ai }

  - it: a malformed platform image tag fails the render
    set:
      platformImageTags:
        postgres: latest
    asserts:
      - failedTemplate:
          errorPattern: platformImageTags.postgres must be a 40-character git tree hash

  # Plan 08 ruling 4: an environment can run Argo CD without a public address (no ingress) and without the admin login (the hosted VM
  # keeps the admin login on as break-glass since Task 12c; both switches still work).
  - it: argo cd has no ingress and no admin user when the environment turns them off
    set:
      argocd:
        adminEnabled: false
        ingressEnabled: false
    documentSelector: { path: metadata.name, value: argocd }
    asserts:
      - equal:
          path: spec.sources[0].helm.valuesObject
          value:
            configs:
              cm:
                admin.enabled: false
            server:
              ingress:
                enabled: false

  # Task 3 review minor, done in Task 12: a quoted value ("false") is a string, which `ne .adminEnabled false` read as on. The switches
  # must be YAML booleans; anything else fails the render (fail closed) instead of opening Argo CD on a public host.
  - it: a quoted argo cd switch fails the render instead of turning it on
    set:
      argocd:
        adminEnabled: "false"
    asserts:
      - failedTemplate:
          errorPattern: argocd.adminEnabled must be true or false \(a YAML boolean, not a string\)
  - it: a quoted argo cd ingress switch fails the render
    set:
      argocd:
        ingressEnabled: "no"
    asserts:
      - failedTemplate:
          errorPattern: argocd.ingressEnabled must be true or false \(a YAML boolean, not a string\)

  - it: the argocd Application reads the environment's own argo cd values file
    set:
      env: hosted
    documentSelector: { path: metadata.name, value: argocd }
    asserts:
      - equal:
          path: spec.sources[0].helm.valueFiles
          value: [$values/argocd/values.yaml, $values/envs/hosted/argocd.yaml]
