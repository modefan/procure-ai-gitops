# procure-apps: the Applications of one environment. envs/<env>/release.yaml sets appRevision; envs/<env>/apps.yaml the rest.

# The procure-ai commit (full SHA) whose charts and images are deployed. Written by procure-ai's publish workflow. Required.
appRevision: ""
# Tags of the platform images (postgres, keycloak, debezium): the git tree hash of infra/<name> at the commit that last changed it, also
# written by the publish workflow. Empty: they take appRevision like the app images.
platformImageTags: {}
# The environment folder under envs/ that holds the values files (platform.yaml, procure-ai.yaml, observability.yaml).
env: local

# Where Argo CD reads from (SSH, read-only deploy keys: bootstrap/install-argocd.ps1 creates the repository Secrets).
repos:
  app: git@github.com:modefan/procure-ai.git
  gitops: git@github.com:modefan/procure-ai-gitops.git
  # The branch of this repo whose values are deployed.
  gitopsRevision: main

destination:
  server: https://kubernetes.default.svc

project: default

# Every Application syncs on its own: prune what left git, undo manual changes, server-side apply (large CRDs, no
# last-applied-configuration). Retries matter on a fresh cluster, where a first sync can fail while a dependency is still starting. Three
# (plan 08 ruling 9, was 10): every retry reruns every migration hook, and only a sync with every retry spent is Failed, which the root's
# health check (argocd/values.yaml) reports as Degraded; with 10 a failing migration kept the root Progressing for well over half an hour.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - ServerSideApply=true
  retry:
    limit: 3
    # 10 s, 20 s, 40 s between the four attempts (was 20 s doubling to 3 min): with procure-app's migration Jobs not retrying pods
    # (backoffLimit 0), a failing migration is Failed, and the root Degraded, within about 5 minutes (tests/Test-Upgrade.ps1).
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 1m

# Fields the API server adds that the charts do not set, so Argo CD's diff would show every StatefulSet with a PVC template as
# OutOfSync forever (and the automated sync would rerun its hooks again and again).
ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jqPathExpressions:
      - .spec.volumeClaimTemplates[]?.apiVersion
      - .spec.volumeClaimTemplates[]?.kind

# Argo CD manages itself after bootstrap/install-argocd.ps1 installed it with the same chart and values (argocd/values.yaml).
argocd:
  enabled: true
  namespace: argocd
  wave: -2
  # The chart's OCI copy on GitHub Container Registry, published by the argo-helm project with every release (10.11.7 there is byte for
  # byte the release on argoproj.github.io, checked 2026-11-08). Not the GitHub Pages index: its 504s made cold renders time out (plan 08
  # fix wave, known item 2). No oci:// prefix: Argo CD treats a scheme-less repoURL with a chart as an OCI registry
  # (helm.IsHelmOciRepo) and needs no repository Secret for a public one. bootstrap/install-argocd.ps1 installs from the same place.
  chartRepo: ghcr.io/argoproj/argo-helm
  chart: argo-cd
  # Argo CD v3.5.7. bootstrap/install-argocd.ps1 reads this line for the first install, so both always match.
  chartVersion: 10.11.7
  releaseName: argocd
  # The environment's switches over argocd/values.yaml (plan 08 ruling 4). Local: both on. A public host: no ingress (the UI only through
  # kubectl port-forward); the admin user is break-glass there (Task 12c: on, people sign in with Keycloak). The rest of the environment's
  # Argo CD settings (url, OIDC issuer) are in envs/<env>/argocd.yaml, the Application's second values file.
  # bootstrap/install-argocd.ps1 reads both lines from envs/<env>/apps.yaml for the first install, so Argo CD never starts more open.
  adminEnabled: true
  ingressEnabled: true

# The infrastructure (procure-ai deploy/charts/procure-platform).
platform:
  enabled: true
  namespace: procure
  wave: -1
  path: deploy/charts/procure-platform
  releaseName: platform
  # The platform turns Healthy only after the apps' migrations ran (each Debezium waits for its service's publication), so the apps
  # (next wave) must not wait for the platform's health, or neither ever starts. The wave gate "synced" lets the next wave start once
  # this Application's sync succeeded (argocd/values.yaml, health check of argoproj.io/Application); its own health still shows the truth.
  waveGate: synced

# Logs, traces and metrics (procure-ai deploy/charts/procure-observability, plan 07 Task 7): the collector and the Aspire dashboard.
# Off by default (an environment turns it on in envs/<env>/apps.yaml). No wave gate: it depends on nothing and turns Healthy in a minute.
observability:
  enabled: false
  namespace: observability
  wave: -1
  path: deploy/charts/procure-observability
  releaseName: observability
  waveGate: ""

# The operator's web UIs for the data stores (procure-ai deploy/charts/procure-ops, plan 08b Task 4): pgAdmin, DbGate (MongoDB), Redis
# Insight, each on its own public host with its own login (values envs/<env>/operator.yaml). Off by default (an environment turns it on in
# envs/<env>/apps.yaml, once bootstrap/new-secrets.ps1 made namespace operator and its Secrets, and new-local-ca.ps1 its procure-ca
# ConfigMap). Its own namespace; the platform's NetworkPolicies (operatorAccess.tools in envs/<env>/platform.yaml) let each tool reach
# its store. No wave gate: nothing waits for it.
operator:
  enabled: false
  namespace: operator
  wave: 0
  path: deploy/charts/procure-ops
  releaseName: operator
  waveGate: ""

# The apps (procure-ai deploy/charts/procure-ai): migrations (Sync hooks), APIs, gateway, web, demo data.
procureAi:
  enabled: true
  namespace: procure
  wave: 0
  path: deploy/charts/procure-ai
  releaseName: procure-ai
  waveGate: ""
