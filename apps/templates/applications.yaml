{{- if not (regexMatch "^[0-9a-f]{40}$" (toString .Values.appRevision)) }}
{{- fail (printf "appRevision must be a full 40-character commit SHA of procure-ai, got %q" (toString .Values.appRevision)) }}
{{- end }}
{{- with .Values.argocd }}
{{- if .enabled }}
{{- $sources := list
      (dict "repoURL" .chartRepo "chart" .chart "targetRevision" (toString .chartVersion)
            "helm" (dict "releaseName" .releaseName "valueFiles" (list "$values/argocd/values.yaml")))
      (dict "repoURL" $.Values.repos.gitops "targetRevision" $.Values.repos.gitopsRevision "ref" "values") }}
---
{{ include "procure-apps.application" (dict "root" $ "name" "argocd" "app" . "sources" $sources "finalizer" false) }}
{{- end }}
{{- end }}
{{- range $name, $file := dict "platform" "platform.yaml" "observability" "observability.yaml" "procure-ai" "procure-ai.yaml" }}
{{- $app := index $.Values (ternary "procureAi" $name (eq $name "procure-ai")) }}
{{- if $app.enabled }}
{{- $sources := include "procure-apps.appRepoSources" (dict "root" $ "app" $app "valuesFile" $file) | fromYamlArray }}
---
{{ include "procure-apps.application" (dict "root" $ "name" $name "app" $app "sources" $sources "finalizer" true) }}
{{- end }}
{{- end }}
